<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vandaag in de shop — fortnite-info</title>
  <meta name="description" content="Alle skins, pickaxes, gliders en back blings in de Fortnite item shop van vandaag, met prijzen in V-Bucks.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">fortnite-info</a>
    <nav class="nav">

      <a class="nav-link active" href="shop.html" aria-current="page">Vandaag in de shop</a>

    <p id="shop-date" class="page-sub">Laden…</p>

    <div class="type-buttons" role="group" aria-label="Type">

      <button type="button" class="pill" data-type="backpack">Back Blings</button>
