# Builds the site from the Fortnite API and publishes it on GitHub Pages.
# Runs every day at 00:15 UTC (just after the item shop resets at 00:00 UTC),
# on every push to main, and by hand via Actions → "Daily build" → "Run workflow".
# Each run also adds today's shop prices to data/prices.json and commits that file back.

name: Daily build

on:
  schedule:
    - cron: '15 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit data/prices.json
  pages: write      # publish to GitHub Pages
  id-token: write   # required by deploy-pages

# Never run two builds at once (they would both try to commit prices.json).
concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from the Fortnite API
        shell: pwsh
        run: ./build.ps1

      - name: Save price history (data/prices.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No new prices."
          else
            git commit -m "Prijzen van $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Collect the site files
        run: |
          mkdir _site
          cp -r *.html seasons.json assets data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
